<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>요기배달 분석 대시보드</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // raw.githubusercontent.com은 CDN 캐시 없이 항상 최신 파일을 반환
      fetch('https://raw.githubusercontent.com/shpark3861/-/main/index.html', { cache: 'no-store' })
        .then(r => r.text())
        .then(html => {
          const jsMatch  = html.match(/assets\/(index-[^"]+\.js)/);
          const cssMatch = html.match(/assets\/(index-[^"]+\.css)/);
          if (cssMatch) {
            const link = document.createElement('link');
            link.rel = 'stylesheet'; link.crossOrigin = 'anonymous';
            link.href = './assets/' + cssMatch[1];
            document.head.appendChild(link);
          }
          if (jsMatch) {
            const s = document.createElement('script');
            s.type = 'module'; s.crossOrigin = 'anonymous';
            s.src = './assets/' + jsMatch[1];
            document.head.appendChild(s);
          }
        });
    </script>
  </body>
</html>
